AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  OpenaiApiKey:
    Type: String
    NoEcho: true

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: "retailco-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "http://retailco-web.s3-website-us-east-1.amazonaws.com"
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  GetTaxRatesFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: lambda.get_all_tax
      Role: arn:aws:iam::655533608647:role/lambda
      Code:
        S3Bucket: retailco-api
        S3Key: api.zip

  GetTaxRatesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetTaxRatesFunction.Arn
      PayloadFormatVersion: "2.0"

  GetTaxRatesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/taxrates"
      Target: !Sub "integrations/${GetTaxRatesIntegration}"

  GetTaxRatesGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetTaxRatesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:us-east-1:655533608647:${HttpApi}/*"

  SetTaxRatesFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: lambda.upsert_tax
      Role: arn:aws:iam::655533608647:role/lambda
      Code:
        S3Bucket: retailco-api
        S3Key: api.zip

  SetTaxRatesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SetTaxRatesFunction.Arn
      PayloadFormatVersion: "2.0"

  SetTaxRatesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/taxrates"
      Target: !Sub "integrations/${SetTaxRatesIntegration}"

  SetTaxRatesGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SetTaxRatesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:us-east-1:655533608647:${HttpApi}/*"

  UploadDocumentFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: lambda.request_upload_url
      Role: arn:aws:iam::655533608647:role/lambda
      Code:
        S3Bucket: retailco-api
        S3Key: api.zip

  UploadDocumentIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt UploadDocumentFunction.Arn
      PayloadFormatVersion: "2.0"

  UploadDocumentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/createdocument"
      Target: !Sub "integrations/${UploadDocumentIntegration}"

  UploadDocumentGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadDocumentFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:us-east-1:655533608647:${HttpApi}/*"

  ProcessDocumentFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: lambda.process_document
      Role: arn:aws:iam::655533608647:role/lambda
      Timeout: 600
      Code:
        S3Bucket: retailco-api
        S3Key: api.zip
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenaiApiKey

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "Prod"
      AutoDeploy: true

  TaxRatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "retailco-taxrates"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: N

      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TaxDocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "retailco-taxdocuments"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH
