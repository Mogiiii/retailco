AWSTemplateFormatVersion: "2010-09-09"

Resources:

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: "retailco-api"
      ProtocolType: HTTP

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: api/functions.handler
      Role: arn:aws:iam::655533608647:role/lambda
      Code:
        S3Bucket: retailco-web
        S3Key: api.zip
