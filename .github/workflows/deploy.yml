name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1

      - name: Deploy Cloudformation template
        run: |
          aws cloudformation deploy \
            --template-file /cloudformation.yml \
            --stack-name retailco \
            --capabilities retailco-cloudformation
            
      - name: Copy api code to /dist
        run: cp -r api/ dist/api

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://retailco-web --delete
